<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{admin/layout}">
<head><title>Products - WoolCraft Admin</title></head>
<body>
<div layout:fragment="content">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h3 class="fw-bold mb-0"><i class="bi bi-box"></i> Products</h3>
        <a href="/admin/products/new" class="btn btn-primary glass-btn"><i class="bi bi-plus-lg"></i> Add Product</a>
    </div>
    <div class="glass-card p-4">
        <div class="table-responsive">
            <table class="table table-hover align-middle">
                <thead>
                    <tr>
                        <th>Image</th>
                        <th>Name</th>
                        <th>Price</th>
                        <th>Stock</th>
                        <th>Category</th>
                        <th>Status</th>
                        <th>Featured</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="p : ${products}">
                        <td>
                            <img th:if="${p.primaryImage}" th:src="@{'/uploads/' + ${p.primaryImage}}" style="width:50px;height:50px;object-fit:cover;border-radius:8px;">
                            <div th:if="${p.primaryImage == null}" style="width:50px;height:50px;border-radius:8px;background:var(--glass-bg);display:flex;align-items:center;justify-content:center;"><i class="bi bi-image" style="opacity:0.3;"></i></div>
                        </td>
                        <td th:text="${p.name}">Name</td>
                        <td th:text="'$' + ${#numbers.formatDecimal(p.price, 1, 2)}">$0.00</td>
                        <td th:text="${p.stock}">0</td>
                        <td th:text="${p.categoryName}">Category</td>
                        <td>
                            <span class="badge" th:classappend="${p.active} ? 'bg-success' : 'bg-danger'" th:text="${p.active} ? 'Active' : 'Hidden'"></span>
                        </td>
                        <td>
                            <i class="bi bi-star-fill text-warning" th:if="${p.featured}"></i>
                            <span th:if="!${p.featured}">—</span>
                        </td>
                        <td>
                            <a th:href="@{/admin/products/edit/{id}(id=${p.id})}" class="btn btn-sm btn-outline-primary"><i class="bi bi-pencil"></i></a>
                            <form method="post" th:action="@{/admin/products/toggle/{id}(id=${p.id})}" style="display:inline;">
                                <button type="submit" class="btn btn-sm btn-outline-warning" th:title="${p.active} ? 'Hide' : 'Show'">
                                    <i class="bi" th:classappend="${p.active} ? 'bi-eye-slash' : 'bi-eye'"></i>
                                </button>
                            </form>
                            <form method="post" th:action="@{/admin/products/delete/{id}(id=${p.id})}" style="display:inline;" onsubmit="return confirm('Delete this product?')">
                                <button type="submit" class="btn btn-sm btn-outline-danger"><i class="bi bi-trash"></i></button>
                            </form>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
</body>
</html>
