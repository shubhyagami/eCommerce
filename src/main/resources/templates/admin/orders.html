<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{admin/layout}">
<head><title>Orders - WoolCraft Admin</title></head>
<body>
<div layout:fragment="content">
    <h3 class="fw-bold mb-4"><i class="bi bi-truck"></i> Orders</h3>
    <div class="glass-card p-4">
        <div class="table-responsive">
            <table class="table table-hover align-middle">
                <thead>
                    <tr>
                        <th>Order #</th>
                        <th>Customer</th>
                        <th>Date</th>
                        <th>Total</th>
                        <th>Status</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="o : ${orders}">
                        <td th:text="${o.id}">1</td>
                        <td th:text="${o.fullName}">Name</td>
                        <td th:text="${o.orderDate}">Date</td>
                        <td th:text="'$' + ${#numbers.formatDecimal(o.grandTotal, 1, 2)}">$0.00</td>
                        <td>
                            <span class="badge" th:classappend="|bg-${o.status == 'PENDING' ? 'warning' : o.status == 'PROCESSING' ? 'info' : o.status == 'SHIPPED' ? 'primary' : o.status == 'DELIVERED' ? 'success' : 'danger'}|" th:text="${o.status}"></span>
                        </td>
                        <td>
                            <a th:href="@{/admin/orders/{id}(id=${o.id})}" class="btn btn-sm btn-outline-primary"><i class="bi bi-eye"></i></a>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
</body>
</html>
