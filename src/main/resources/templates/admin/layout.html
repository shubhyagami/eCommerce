<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WoolCraft Admin</title>
    <link rel="stylesheet" href="/webjars/bootstrap/5.3.3/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" th:href="@{/css/admin.css}">
    <th:block layout:fragment="head"></th:block>
</head>
<body>
    <nav class="navbar navbar-expand-lg glass-navbar fixed-top">
        <div class="container-fluid">
            <a class="navbar-brand fw-bold" href="/admin/dashboard">
                <i class="bi bi-shield-lock"></i> WoolCraft Admin
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#adminNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="adminNav">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item"><a class="nav-link" href="/admin/dashboard"><i class="bi bi-speedometer2"></i> Dashboard</a></li>
                    <li class="nav-item"><a class="nav-link" href="/admin/products"><i class="bi bi-box"></i> Products</a></li>
                    <li class="nav-item"><a class="nav-link" href="/admin/categories"><i class="bi bi-tags"></i> Categories</a></li>
                    <li class="nav-item"><a class="nav-link" href="/admin/orders"><i class="bi bi-truck"></i> Orders</a></li>
                    <li class="nav-item"><a class="nav-link" href="/admin/customers"><i class="bi bi-people"></i> Customers</a></li>
                    <li class="nav-item"><a class="nav-link" href="/admin/messages"><i class="bi bi-envelope"></i> Messages</a></li>
                    <li class="nav-item"><a class="nav-link" href="/admin/reviews"><i class="bi bi-star"></i> Reviews</a></li>
                    <li class="nav-item"><a class="nav-link" href="/admin/chat"><i class="bi bi-chat-dots"></i> Chat</a></li>
                </ul>
                <a href="/" class="btn btn-outline-primary btn-sm me-2"><i class="bi bi-house"></i> Site</a>
                <form method="post" th:action="@{/logout}" style="display:inline;">
                    <button type="submit" class="btn btn-outline-danger btn-sm"><i class="bi bi-box-arrow-right"></i> Logout</button>
                </form>
            </div>
        </div>
    </nav>
    <div style="height: 76px;"></div>
    <main class="container-fluid py-4 px-4">
        <th:block layout:fragment="content"></th:block>
    </main>
    <script src="/webjars/jquery/3.7.1/jquery.min.js"></script>
    <script src="/webjars/bootstrap/5.3.3/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
    <script src="/webjars/sockjs-client/1.5.1/sockjs.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/stompjs@2.3.3/lib/stomp.min.js"></script>
    <script th:src="@{/js/main.js}"></script>
    <script th:src="@{/js/admin.js}"></script>
    <th:block layout:fragment="scripts"></th:block>
</body>
</html>
