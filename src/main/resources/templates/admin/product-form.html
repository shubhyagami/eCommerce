<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{admin/layout}">
<head><title th:text="${product.id != null} ? 'Edit Product' : 'New Product'">Product Form</title></head>
<body>
<div layout:fragment="content">
    <h3 class="fw-bold mb-4" th:text="${product.id != null} ? 'Edit Product' : 'New Product'">
        <i class="bi bi-box"></i> Product Form
    </h3>
    <div class="row">
        <div class="col-lg-8">
            <div class="glass-card p-4">
                <form method="post" th:action="@{/admin/products/save}" enctype="multipart/form-data">
                    <input type="hidden" name="id" th:value="${product.id}">
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Product Name</label>
                            <input type="text" name="name" class="form-control" th:value="${product.name}" required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Title</label>
                            <input type="text" name="title" class="form-control" th:value="${product.title}">
                        </div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Description</label>
                        <textarea name="description" class="form-control" rows="4" required>[[${product.description}]]</textarea>
                    </div>
                    <div class="row">
                        <div class="col-md-4 mb-3">
                            <label class="form-label">Price ($)</label>
                            <input type="number" step="0.01" name="price" class="form-control" th:value="${product.price}" required>
                        </div>
                        <div class="col-md-4 mb-3">
                            <label class="form-label">Discount Price ($)</label>
                            <input type="number" step="0.01" name="discountPrice" class="form-control" th:value="${product.discountPrice}">
                        </div>
                        <div class="col-md-4 mb-3">
                            <label class="form-label">Stock</label>
                            <input type="number" name="stock" class="form-control" th:value="${product.stock}" required>
                        </div>
                    </div>
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Category</label>
                            <select name="categoryId" class="form-select" required>
                                <option value="">Select Category</option>
                                <option th:each="cat : ${categories}" th:value="${cat.id}" th:text="${cat.name}" th:selected="${cat.id == product.categoryId}"></option>
                            </select>
                        </div>
                        <div class="col-md-3 mb-3">
                            <label class="form-label">&nbsp;</label>
                            <div class="form-check">
                                <input type="checkbox" name="featured" class="form-check-input" value="true" th:checked="${product.featured}">
                                <label class="form-check-label">Featured</label>
                            </div>
                        </div>
                        <div class="col-md-3 mb-3">
                            <label class="form-label">&nbsp;</label>
                            <div class="form-check">
                                <input type="checkbox" name="active" class="form-check-input" value="true" th:checked="${product.active != null ? product.active : true}">
                                <label class="form-check-label">Active</label>
                            </div>
                        </div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Product Images</label>
                        <input type="file" name="images" class="form-control" multiple accept="image/*">
                        <small class="text-muted">Upload multiple images. First image will be primary.</small>
                    </div>
                    <div th:if="${product.images != null and !product.images.isEmpty()}" class="mb-3">
                        <label class="form-label">Current Images</label>
                        <div class="d-flex gap-2 flex-wrap">
                            <div th:each="img : ${product.images}" class="position-relative" style="width:100px;">
                                <img th:src="@{'/uploads/' + ${img}}" style="width:100px;height:100px;object-fit:cover;border-radius:8px;">
                                <input type="hidden" name="keepImages" th:value="${img}">
                            </div>
                        </div>
                    </div>
                    <button type="submit" class="btn btn-primary glass-btn">Save Product</button>
                    <a href="/admin/products" class="btn btn-outline-secondary ms-2">Cancel</a>
                </form>
            </div>
        </div>
    </div>
</div>
</body>
</html>
