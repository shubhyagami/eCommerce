<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{admin/layout}">
<head><title>Messages - WoolCraft Admin</title></head>
<body>
<div layout:fragment="content">
    <h3 class="fw-bold mb-4"><i class="bi bi-envelope"></i> Messages</h3>
    <div class="row g-4">
        <div th:each="msg : ${messages}" class="col-md-6">
            <div class="glass-card p-4">
                <div class="d-flex justify-content-between">
                    <h6 class="fw-bold" th:text="${msg.name}">Name</h6>
                    <small class="text-muted" th:text="${msg.createdAt}">Date</small>
                </div>
                <small class="text-muted d-block mb-2" th:text="${msg.email}"></small>
                <p class="mb-2" th:text="${msg.message}">Message</p>
                <div th:if="${msg.reply}" class="bg-light p-3 rounded-3 mt-2">
                    <small class="fw-bold">Reply:</small>
                    <p class="mb-0" th:text="${msg.reply}">Reply</p>
                </div>
                <div th:if="${msg.reply == null}">
                    <form method="post" th:action="@{/admin/messages/reply}" class="mt-3">
                        <input type="hidden" name="id" th:value="${msg.id}">
                        <div class="input-group">
                            <input type="text" name="reply" class="form-control" placeholder="Type reply..." required>
                            <button type="submit" class="btn btn-primary glass-btn">Send</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
