<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{admin/layout}">
<head><title>Chat - WoolCraft Admin</title></head>
<body>
<div layout:fragment="content">
    <div class="row justify-content-center">
        <div class="col-lg-8">
            <div class="glass-card">
                <div class="p-3 border-bottom d-flex align-items-center">
                    <a href="/admin/chat" class="btn btn-sm btn-outline-secondary me-2"><i class="bi bi-arrow-left"></i></a>
                    <i class="bi bi-person-circle fs-4 me-2"></i>
                    <h5 class="fw-bold mb-0" th:text="${room.user.name}">Customer</h5>
                </div>
                <div class="chat-messages p-3" id="chatMessages" style="height:450px;overflow-y:auto;">
                    <div th:if="${messages != null}">
                        <div class="chat-msg mb-3" th:each="msg : ${messages}" th:classappend="${msg.sender == 'ADMIN'} ? 'text-end' : ''">
                            <div class="d-inline-block p-3 rounded-3" th:classappend="${msg.sender == 'ADMIN'} ? 'bg-primary text-white' : 'bg-light'">
                                <small class="d-block" th:text="${msg.content}">message</small>
                                <small class="opacity-75" style="font-size:0.7rem;" th:text="${msg.sentAt}"></small>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="p-3 border-top">
                    <form id="adminChatForm" onsubmit="return sendAdminChatMessage()">
                        <input type="hidden" id="roomId" th:value="${room.id}">
                        <div class="input-group">
                            <input type="text" class="form-control" id="chatInput" placeholder="Type your reply..." required>
                            <button type="submit" class="btn btn-primary glass-btn">Send</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
<script th:src="@{/js/chat.js}"></script>
</body>
</html>
