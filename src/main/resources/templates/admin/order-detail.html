<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{admin/layout}">
<head><title>Order #${order.id} - WoolCraft Admin</title></head>
<body>
<div layout:fragment="content">
    <h3 class="fw-bold mb-4">Order #<span th:text="${order.id}"></span></h3>
    <div class="row g-4">
        <div class="col-lg-8">
            <div class="glass-card p-4">
                <h5 class="fw-bold mb-3">Items</h5>
                <table class="table">
                    <thead><tr><th>Product</th><th>Qty</th><th>Price</th><th>Total</th></tr></thead>
                    <tbody>
                        <tr th:each="item : ${order.items}">
                            <td th:text="${item.productName}">Product</td>
                            <td th:text="${item.quantity}">1</td>
                            <td th:text="'$' + ${#numbers.formatDecimal(item.price, 1, 2)}">$0.00</td>
                            <td th:text="'$' + ${#numbers.formatDecimal(item.subtotal, 1, 2)}">$0.00</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
        <div class="col-lg-4">
            <div class="glass-card p-4">
                <h5 class="fw-bold mb-3">Actions</h5>
                <form method="post" th:action="@{/admin/orders/status}">
                    <input type="hidden" name="orderId" th:value="${order.id}">
                    <div class="mb-3">
                        <label class="form-label">Update Status</label>
                        <select name="status" class="form-select">
                            <option value="PENDING" th:selected="${order.status == 'PENDING'}">Pending</option>
                            <option value="PROCESSING" th:selected="${order.status == 'PROCESSING'}">Processing</option>
                            <option value="SHIPPED" th:selected="${order.status == 'SHIPPED'}">Shipped</option>
                            <option value="DELIVERED" th:selected="${order.status == 'DELIVERED'}">Delivered</option>
                            <option value="CANCELLED" th:selected="${order.status == 'CANCELLED'}">Cancelled</option>
                        </select>
                    </div>
                    <button type="submit" class="btn btn-primary w-100 glass-btn">Update</button>
                </form>
            </div>
            <div class="glass-card p-4 mt-3">
                <h6 class="fw-bold">Shipping Info</h6>
                <small th:text="${order.fullName}"></small><br>
                <small th:text="${order.address}"></small><br>
                <small th:text="${order.city} + ', ' + ${order.state}"></small><br>
                <small th:text="${order.mobile}"></small>
            </div>
        </div>
    </div>
</div>
</body>
</html>
