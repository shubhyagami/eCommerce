<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout/base}">
<head><title>My Wishlist - WoolCraft</title></head>
<body>
<div layout:fragment="content">
    <div class="container py-4">
        <h3 class="fw-bold mb-4"><i class="bi bi-heart"></i> My Wishlist</h3>
        <div th:if="${products == null or products.isEmpty()}">
            <div class="glass-card text-center p-5">
                <i class="bi bi-heartbreak" style="font-size:4rem;opacity:0.3;"></i>
                <h5 class="mt-3">Your wishlist is empty</h5>
                <a href="/products" class="btn btn-primary glass-btn mt-3">Browse Products</a>
            </div>
        </div>
        <div class="row" th:if="${products != null and !products.isEmpty()}">
            <th:block th:each="p : ${products}">
                <div th:replace="~{fragments/product-card :: productCard(p)}"></div>
            </th:block>
        </div>
    </div>
</div>
</body>
</html>
