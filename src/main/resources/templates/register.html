<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout/base}">
<head><title>Register - WoolCraft</title></head>
<body>
<div layout:fragment="content">
    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="glass-card p-5">
                    <div class="text-center mb-4">
                        <span style="font-size:3rem;">🧶</span>
                        <h3 class="fw-bold mt-2">Create Account</h3>
                        <p class="text-muted">Join the WoolCraft family</p>
                    </div>
                    <div th:if="${error}" class="alert alert-danger" th:text="${error}">Error</div>
                    <form method="post" th:action="@{/register}" th:object="${user}">
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Full Name</label>
                                <input type="text" th:field="*{name}" class="form-control" required>
                                <small th:if="${#fields.hasErrors('name')}" th:errors="*{name}" class="text-danger"></small>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Phone</label>
                                <input type="tel" th:field="*{phone}" class="form-control">
                            </div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Email</label>
                            <input type="email" th:field="*{email}" class="form-control" required>
                            <small th:if="${#fields.hasErrors('email')}" th:errors="*{email}" class="text-danger"></small>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Password</label>
                            <input type="password" th:field="*{password}" class="form-control" required>
                            <small th:if="${#fields.hasErrors('password')}" th:errors="*{password}" class="text-danger"></small>
                        </div>
                        <button type="submit" class="btn btn-primary w-100 glass-btn">Create Account</button>
                    </form>
                    <div class="text-center mt-3">
                        <small class="text-muted">Already have an account? <a href="/login">Sign In</a></small>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
