<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout/base}">
<head><title>My Orders - WoolCraft</title></head>
<body>
<div layout:fragment="content">
    <div class="container py-4">
        <h3 class="fw-bold mb-4"><i class="bi bi-box"></i> My Orders</h3>
        <div th:if="${orders == null or orders.isEmpty()}">
            <div class="glass-card text-center p-5">
                <i class="bi bi-inbox" style="font-size:4rem;opacity:0.3;"></i>
                <h5 class="mt-3">No orders yet</h5>
                <a href="/products" class="btn btn-primary glass-btn mt-3">Start Shopping</a>
            </div>
        </div>
        <div th:if="${orders != null and !orders.isEmpty()}">
            <div class="glass-card p-4">
                <div class="order-card mb-3 p-3 border-bottom" th:each="order : ${orders}">
                    <div class="d-flex justify-content-between align-items-center">
                        <div>
                            <h6 class="fw-bold mb-1">Order #<span th:text="${order.id}"></span></h6>
                            <small class="text-muted" th:text="${order.orderDate}">Date</small>
                        </div>
                        <div class="text-end">
                            <span class="badge" th:classappend="|bg-${order.status == 'PENDING' ? 'warning' : order.status == 'PROCESSING' ? 'info' : order.status == 'SHIPPED' ? 'primary' : order.status == 'DELIVERED' ? 'success' : 'danger'}|" th:text="${order.status}">Status</span>
                            <div class="fw-bold mt-1" th:text="'$' + ${#numbers.formatDecimal(order.grandTotal, 1, 2)}">$0.00</div>
                        </div>
                    </div>
                    <a th:href="@{/orders/{id}(id=${order.id})}" class="btn btn-sm btn-outline-primary mt-2">View Details</a>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
