<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout/base}">
<head><title>Support Chat - WoolCraft</title></head>
<body>
<div layout:fragment="content">
    <div class="container py-4">
        <div class="row justify-content-center">
            <div class="col-lg-8">
                <div class="glass-card">
                    <div class="p-3 border-bottom d-flex align-items-center">
                        <i class="bi bi-headset fs-4 me-2"></i>
                        <h5 class="fw-bold mb-0">WoolCraft Support</h5>
                    </div>
                    <div class="chat-messages p-3" id="chatMessages" style="height:400px;overflow-y:auto;">
                        <div th:if="${messages != null}">
                            <div class="chat-msg mb-3" th:each="msg : ${messages}" th:classappend="${msg.sender == 'USER'} ? 'text-end' : ''">
                                <div class="d-inline-block p-3 rounded-3" th:classappend="${msg.sender == 'USER'} ? 'bg-primary text-white' : 'bg-light'">
                                    <small class="d-block" th:text="${msg.content}">message</small>
                                    <small class="opacity-75" style="font-size:0.7rem;" th:text="${msg.sentAt}"></small>
                                </div>
                            </div>
                        </div>
                        <div th:if="${messages == null or messages.isEmpty()}" class="text-center text-muted py-5">
                            <i class="bi bi-chat-dots" style="font-size:2rem;"></i>
                            <p>Start a conversation with our support team</p>
                        </div>
                    </div>
                    <div class="p-3 border-top">
                        <form id="chatForm" onsubmit="return sendChatMessage()">
                            <input type="hidden" id="roomId" th:value="${room.id}">
                            <div class="input-group">
                                <input type="text" class="form-control" id="chatInput" placeholder="Type your message..." required>
                                <button type="submit" class="btn btn-primary glass-btn">Send</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
<script th:src="@{/js/chat.js}"></script>
</body>
</html>
