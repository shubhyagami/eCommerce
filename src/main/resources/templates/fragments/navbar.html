<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<nav th:fragment="navbar" class="navbar navbar-expand-lg glass-navbar fixed-top">
    <div class="container">
        <a class="navbar-brand fw-bold" href="/">
            <span class="brand-icon">🧶</span> WoolCraft
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav me-auto">
                <li class="nav-item"><a class="nav-link" href="/">Home</a></li>
                <li class="nav-item"><a class="nav-link" href="/products">Products</a></li>
                <li class="nav-item"><a class="nav-link" href="/contact">Contact</a></li>
            </ul>
            <form class="d-flex me-3 search-form" action="/search" method="get">
                <div class="autocomplete-wrap">
                    <input class="form-control search-input" type="search" name="q" placeholder="Search clips..." id="searchInput" autocomplete="off">
                    <div class="autocomplete-results" id="autocompleteResults"></div>
                </div>
            </form>
            <ul class="navbar-nav align-items-center">
                <li class="nav-item">
                    <button class="btn btn-link nav-link theme-toggle" id="themeToggle">
                        <i class="bi bi-moon-fill"></i>
                    </button>
                </li>
                <li class="nav-item">
                    <a class="nav-link position-relative" href="/wishlist" sec:authorize="isAuthenticated()">
                        <i class="bi bi-heart"></i>
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link position-relative" href="/cart" sec:authorize="isAuthenticated()">
                        <i class="bi bi-cart3"></i>
                        <span class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger cart-badge" id="cartCount">0</span>
                    </a>
                </li>
                <li class="nav-item dropdown" sec:authorize="isAuthenticated()">
                    <a class="nav-link dropdown-toggle" href="#" role="button" data-bs-toggle="dropdown">
                        <i class="bi bi-person-circle"></i>
                    </a>
                    <ul class="dropdown-menu dropdown-menu-end glass-dropdown">
                        <li><a class="dropdown-item" href="/profile"><i class="bi bi-person me-2"></i>Profile</a></li>
                        <li><a class="dropdown-item" href="/orders"><i class="bi bi-box me-2"></i>Orders</a></li>
                        <li><a class="dropdown-item" href="/wishlist"><i class="bi bi-heart me-2"></i>Wishlist</a></li>
                        <li><a class="dropdown-item" href="/chat"><i class="bi bi-chat-dots me-2"></i>Support Chat</a></li>
                        <li sec:authorize="hasAuthority('ROLE_ADMIN')"><hr class="dropdown-divider"></li>
                        <li sec:authorize="hasAuthority('ROLE_ADMIN')"><a class="dropdown-item text-primary" href="/admin/dashboard"><i class="bi bi-shield-lock me-2"></i>Admin Panel</a></li>
                        <li><hr class="dropdown-divider"></li>
                        <li>
                            <form method="post" th:action="@{/logout}" style="display:inline;">
                                <button type="submit" class="dropdown-item text-danger" style="border:none;background:none;width:100%;text-align:left;"><i class="bi bi-box-arrow-right me-2"></i>Logout</button>
                            </form>
                        </li>
                    </ul>
                </li>
                <li class="nav-item" sec:authorize="!isAuthenticated()">
                    <a class="nav-link" href="/login"><i class="bi bi-person"></i> Login</a>
                </li>
                <li class="nav-item" sec:authorize="!isAuthenticated()">
                    <a class="btn btn-primary ms-2 btn-sm glass-btn" href="/register">Sign Up</a>
                </li>
            </ul>
        </div>
    </div>
</nav>
<div style="height: 76px;"></div>
</body>
</html>
