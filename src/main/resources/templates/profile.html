<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout/base}">
<head><title>My Profile - WoolCraft</title></head>
<body>
<div layout:fragment="content">
    <div class="container py-4">
        <div th:if="${param.updated}" class="alert alert-success">Profile updated successfully!</div>
        <div class="row g-4">
            <div class="col-lg-3">
                <div class="glass-card p-4 text-center">
                    <div style="font-size:4rem;">🧶</div>
                    <h5 class="fw-bold mt-2" th:text="${user.name}">Name</h5>
                    <p class="text-muted small" th:text="${user.email}">Email</p>
                    <a href="/orders" class="btn btn-outline-primary btn-sm w-100 mb-2"><i class="bi bi-box"></i> My Orders</a>
                    <a href="/wishlist" class="btn btn-outline-primary btn-sm w-100 mb-2"><i class="bi bi-heart"></i> Wishlist</a>
                    <a href="/chat" class="btn btn-outline-primary btn-sm w-100"><i class="bi bi-chat-dots"></i> Support</a>
                </div>
            </div>
            <div class="col-lg-9">
                <div class="glass-card p-4">
                    <h5 class="fw-bold mb-4">Edit Profile</h5>
                    <form method="post" th:action="@{/profile/edit}">
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Full Name</label>
                                <input type="text" name="name" class="form-control" th:value="${user.name}" required>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Phone</label>
                                <input type="tel" name="phone" class="form-control" th:value="${user.phone}">
                            </div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Address</label>
                            <textarea name="address" class="form-control" rows="2">[[${user.address}]]</textarea>
                        </div>
                        <div class="row">
                            <div class="col-md-4 mb-3">
                                <label class="form-label">City</label>
                                <input type="text" name="city" class="form-control" th:value="${user.city}">
                            </div>
                            <div class="col-md-4 mb-3">
                                <label class="form-label">State</label>
                                <input type="text" name="state" class="form-control" th:value="${user.state}">
                            </div>
                            <div class="col-md-4 mb-3">
                                <label class="form-label">Postal Code</label>
                                <input type="text" name="postalCode" class="form-control" th:value="${user.postalCode}">
                            </div>
                        </div>
                        <button type="submit" class="btn btn-primary glass-btn">Save Changes</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
