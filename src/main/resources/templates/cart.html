<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout/base}">
<head><title>Shopping Cart - WoolCraft</title></head>
<body>
<div layout:fragment="content">
    <div class="container py-4">
        <h3 class="fw-bold mb-4"><i class="bi bi-cart3"></i> Shopping Cart</h3>
        <div th:if="${cart.items == null or cart.items.isEmpty()}">
            <div class="glass-card text-center p-5">
                <i class="bi bi-cart-x" style="font-size:4rem;opacity:0.3;"></i>
                <h5 class="mt-3">Your cart is empty</h5>
                <a href="/products" class="btn btn-primary glass-btn mt-3">Start Shopping</a>
            </div>
        </div>
        <div th:if="${cart.items != null and !cart.items.isEmpty()}">
            <div class="row g-4">
                <div class="col-lg-8">
                    <div class="glass-card p-4">
                        <div class="cart-item d-flex align-items-center mb-3 pb-3 border-bottom" th:each="item : ${cart.items}">
                            <div class="cart-item-img me-3">
                                <img th:if="${item.productImage != null}" th:src="@{'/uploads/' + ${item.productImage}}" style="width:80px;height:80px;object-fit:cover;border-radius:12px;">
                                <div th:if="${item.productImage == null}" style="width:80px;height:80px;border-radius:12px;background:var(--glass-bg);display:flex;align-items:center;justify-content:center;">
                                    <i class="bi bi-image" style="opacity:0.3;"></i>
                                </div>
                            </div>
                            <div class="flex-grow-1">
                                <h6 class="fw-bold mb-1" th:text="${item.productName}">Product</h6>
                                <div class="d-flex align-items-center gap-3">
                                    <div class="input-group input-group-sm" style="width:110px;">
                                        <button class="btn btn-outline-secondary" type="button" onclick="updateCartItem(${item.id}, ${item.quantity - 1})">-</button>
                                        <input type="text" class="form-control text-center" th:value="${item.quantity}" readonly>
                                        <button class="btn btn-outline-secondary" type="button" onclick="updateCartItem(${item.id}, ${item.quantity + 1})">+</button>
                                    </div>
                                    <span class="fw-bold" th:text="'$' + ${#numbers.formatDecimal(item.subtotal, 1, 2)}"></span>
                                    <button class="btn btn-sm btn-outline-danger" onclick="removeCartItem(${item.id})"><i class="bi bi-trash"></i></button>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="col-lg-4">
                    <div class="glass-card p-4">
                        <h5 class="fw-bold mb-3">Order Summary</h5>
                        <div class="d-flex justify-content-between mb-2">
                            <span class="text-muted">Subtotal</span>
                            <span th:text="'$' + ${#numbers.formatDecimal(cart.subtotal, 1, 2)}"></span>
                        </div>
                        <div class="d-flex justify-content-between mb-2">
                            <span class="text-muted">Shipping</span>
                            <span th:text="${cart.subtotal >= 500} ? 'FREE' : '$9.99'"></span>
                        </div>
                        <hr>
                        <div class="d-flex justify-content-between fw-bold fs-5">
                            <span>Total</span>
                            <span th:text="'$' + ${#numbers.formatDecimal(cart.subtotal >= 500 ? cart.subtotal : cart.subtotal + 9.99, 1, 2)}"></span>
                        </div>
                        <a href="/checkout" class="btn btn-primary w-100 mt-3 glass-btn">Proceed to Checkout</a>
                        <a href="/products" class="btn btn-outline-secondary w-100 mt-2">Continue Shopping</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
<script th:src="@{/js/cart.js}"></script>
</body>
</html>
