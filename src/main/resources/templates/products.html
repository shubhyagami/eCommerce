<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout/base}">
<head><title>Products - WoolCraft</title></head>
<body>
<div layout:fragment="content">
    <div class="container py-4">
        <div class="row">
            <div class="col-lg-3">
                <div class="glass-card p-4 mb-4">
                    <h5 class="fw-bold mb-3">Categories</h5>
                    <ul class="list-unstyled">
                        <li class="mb-2"><a href="/products" class="text-decoration-none">All Products</a></li>
                        <li class="mb-2" th:each="cat : ${categories}">
                            <a th:href="@{/products(category=${cat.id})}" class="text-decoration-none" th:text="${cat.name}">Category</a>
                        </li>
                    </ul>
                </div>
            </div>
            <div class="col-lg-9">
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <h4 class="fw-bold mb-0" th:if="${selectedCategory}" th:text="${selectedCategory.name}">Category</h4>
                    <h4 class="fw-bold mb-0" th:if="${selectedCategory == null and query == null}">All Products</h4>
                    <h4 class="fw-bold mb-0" th:if="${query}">Search: <span class="text-muted" th:text="${query}"></span></h4>
                    <small class="text-muted" th:text="${#lists.size(products)} + ' products'"></small>
                </div>
                <div class="row" th:if="${products != null and !products.isEmpty()}">
                    <th:block th:each="p : ${products}">
                        <div th:replace="~{fragments/product-card :: productCard(p)}"></div>
                    </th:block>
                </div>
                <div class="text-center py-5" th:if="${products == null or products.isEmpty()}">
                    <i class="bi bi-search" style="font-size:3rem;opacity:0.3;"></i>
                    <p class="text-muted mt-3">No products found.</p>
                    <a href="/products" class="btn btn-primary glass-btn">View All Products</a>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
