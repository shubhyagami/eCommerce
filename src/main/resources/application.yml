server:
  port: ${PORT:8080}

spring:
  datasource:
    url: jdbc:h2:mem:woolcraft
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.H2Dialect
  thymeleaf:
    cache: false
    prefix: classpath:/templates/
    suffix: .html
  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 50MB
  jackson:
    serialization:
      write-dates-as-timestamps: false
  web:
    resources:
      static-locations: classpath:/static/, file:./uploads/

woolcraft:
  upload-dir: uploads/products

logging:
  level:
    com.woolcraft: DEBUG
    org.springframework.security: INFO
